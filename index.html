<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>경남치유농업센터 교육장 예약 대장</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F3F4EF;
    color: #232921;
    font-family: 'Pretendard','Noto Sans KR',-apple-system,sans-serif;
  }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid #1F6F5C; outline-offset: 1px;
  }
  header {
    background: #1E2A3D; color: #F3F4EF; padding: 22px 28px;
  }
  .header-inner {
    max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between;
    align-items: flex-end; flex-wrap: wrap; gap: 16px;
  }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: #9BB0A6; font-weight: 500; }
  h1 { margin: 4px 0 0; font-family: 'Noto Serif KR', serif; font-size: 24px; font-weight: 700; }
  .mode-toggle { display: flex; gap: 4px; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 8px; }
  .mode-btn {
    padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500;
    background: transparent; color: #D8DDD9; position: relative;
  }
  .mode-btn.active { background: #F3F4EF; color: #1E2A3D; }
  .badge-count {
    margin-left: 6px; background: #C98A2C; color: #fff; border-radius: 999px;
    font-size: 11px; padding: 1px 6px; font-weight: 700;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px; }
  .card { background: #FFFFFF; border: 1px solid #DBDCD4; border-radius: 10px; padding: 20px; }
  .card h2 { margin: 0 0 4px; font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700; }
  .card .sub { margin: 0 0 16px; font-size: 12.5px; color: #8A9086; }
  label.field { display: block; margin-bottom: 14px; }
  label.field span { display: block; font-size: 13px; font-weight: 500; color: #4C5349; margin-bottom: 5px; }
  .input {
    width: 100%; padding: 9px 11px; border: 1px solid #C9CBC0; border-radius: 6px;
    font-size: 14px; background: #FBFBF8; color: #232921;
  }
  textarea.input { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .submit-btn {
    width: 100%; padding: 11px; background: #1F6F5C; color: #fff; border: none;
    border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .nav-btn {
    padding: 7px 12px; border: 1px solid #C9CBC0; border-radius: 6px; background: #FBFBF8;
    font-size: 13px; cursor: pointer; color: #4C5349;
  }
  .date-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .date-nav .date-label { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 16px; }
  .grid-2col { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  .grid-2col-rev { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
  @media (max-width: 760px) {
    .grid-2col, .grid-2col-rev { grid-template-columns: 1fr; }
  }
  .ledger { border: 1px solid #DBDCD4; border-radius: 8px; overflow: hidden; }
  .ledger-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-top: 1px solid #EBECE4; position: relative; background: #FFFFFF;
  }
  .ledger-row:first-child { border-top: none; }
  .ledger-row.compact { padding: 6px 12px; }
  .ledger-time { font-family: ui-monospace,'SF Mono',Menlo,monospace; font-size: 12.5px; color: #6B7268; width: 46px; flex-shrink: 0; }
  .ledger-bar { flex: 1; height: 20px; border-radius: 4px; border: 1px dashed #E1E2D9; }
  .ledger-row.compact .ledger-bar { height: 16px; }
  .ledger-status { font-size: 11.5px; font-weight: 700; flex-shrink: 0; }
  .now-line { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #A8442E; }
  .legend { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6B7268; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }
  .res-row { border: 1px solid #E1E2D9; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: #FEFEFC; }
  .res-row .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .res-row .time-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .res-row .time-mono { font-family: ui-monospace,monospace; font-size: 13px; font-weight: 700; color: #1E2A3D; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid; }
  .res-row .meta { margin: 2px 0 0; font-size: 13.5px; font-weight: 500; }
  .res-row .purpose { margin: 4px 0 0; font-size: 13px; color: #6B7268; }
  .res-row .reject-reason { margin: 6px 0 0; font-size: 12.5px; color: #7A3120; }
  .res-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-approve {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #1F6F5C; background: #1F6F5C;
    color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn-reject {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #A8442E; background: #fff;
    color: #A8442E; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .filter-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 14px; border-radius: 999px; border: 1px solid #C9CBC0; cursor: pointer; font-size: 13px;
    background: #FBFBF8; color: #4C5349; font-weight: 500;
  }
  .filter-btn.active { background: #1E2A3D; color: #fff; font-weight: 700; border-color: #1E2A3D; }
  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; border: 1px solid; }
  .banner-error { background: #F5E3DF; border-color: #A8442E; color: #7A3120; }
  .banner-notice { color: #1E4A34; font-size: 13px; margin-bottom: 10px; }
  .banner-pending { background: #FBF6EC; border-color: #C98A2C; color: #7A5312; font-weight: 700; }
  .signin-box { text-align: center; padding: 48px 20px; }
  .signin-box p { color: #6B7268; font-size: 13.5px; margin: 8px 0 20px; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: #fff;
    border: 1px solid #C9CBC0; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .muted { color: #8A9086; font-size: 13.5px; }
  .hidden { display: none !important; }
  .signed-in-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: #4C5349; }
  .signed-in-bar button { background: none; border: none; text-decoration: underline; cursor: pointer; color: #6B7268; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <p class="eyebrow">GYEONGNAM AGRICULTURAL RESEARCH &amp; EXTENSION SERVICES</p>
      <h1>경남치유농업센터 교육장 예약 대장</h1>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnModeApply">신청자 화면</button>
      <button class="mode-btn" id="btnModeAdmin">담당자 화면<span class="badge-count hidden" id="pendingBadge">0</span></button>
    </div>
  </div>
</header>

<main>
  <div id="globalBanner"></div>
  <div id="applyView"></div>
  <div id="adminView" class="hidden"></div>
</main>

<!-- Firebase SDK (v10, modular) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc, updateDoc,
  query, orderBy, serverTimestamp, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ============================================================
   1) Firebase 설정 — Firebase 콘솔에서 발급받은 값으로 교체하세요
   (프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAmhz2pc5GaZ66Yl1asgPJYK07KkPBWWM4",
  authDomain: "reservation-ahd.firebaseapp.com",
  projectId: "reservation-ahd",
  storageBucket: "reservation-ahd.firebasestorage.app",
  messagingSenderId: "764864266632",
  appId: "1:764864266632:web:66c11750573a2d5382ba3d",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const ROOM_NAME = "경남치유농업센터 교육장";

/* ---------- 시간/날짜 유틸 ---------- */
function timeOptions(start, end, stepMin) {
  const out = [];
  let [h, m] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  while (h < eh || (h === eh && m <= em)) {
    out.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
    m += stepMin;
    if (m >= 60) { m -= 60; h += 1; }
  }
  return out;
}
const START_OPTIONS = timeOptions("09:00", "17:30", 30);
const END_OPTIONS = timeOptions("09:30", "18:00", 30);
const GRID_SLOTS = timeOptions("09:00", "17:30", 30);

function toMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function overlaps(aS, aE, bS, bE) { return toMin(aS) < toMin(bE) && toMin(aE) > toMin(bS); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

const STATUS_META = {
  pending:  { label: "승인 대기", bg: "#FBF0DC", border: "#C98A2C", text: "#7A5312" },
  approved: { label: "승인됨",   bg: "#E4EFE6", border: "#2E6E4E", text: "#1E4A34" },
  rejected: { label: "거절됨",   bg: "#F5E3DF", border: "#A8442E", text: "#7A3120" },
};

/* ---------- 전역 상태 ---------- */
let reservations = [];       // Firestore 실시간 구독 결과
let currentUser = null;      // Firebase Auth 사용자
let isAdmin = false;         // admins 컬렉션에 등록된 이메일인지
let mode = "apply";
let applyDate = todayStr();
let adminDate = todayStr();
let adminFilter = "all";

/* ---------- Firestore 실시간 구독 ---------- */
const resQuery = query(collection(db, "reservations"), orderBy("date"), orderBy("startTime"));
onSnapshot(resQuery, (snap) => {
  reservations = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderAll();
}, (err) => {
  showGlobalBanner(`실시간 데이터를 불러오지 못했습니다: ${err.message}`);
});

/* ---------- 인증 상태 ---------- */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  isAdmin = false;
  if (user) {
    try {
      const snap = await getDoc(doc(db, "admins", user.email));
      isAdmin = snap.exists();
    } catch (e) {
      isAdmin = false;
    }
  }
  renderAll();
});

function showGlobalBanner(msg) {
  document.getElementById("globalBanner").innerHTML =
    msg ? `<div class="banner banner-error">${escapeHtml(msg)}</div>` : "";
}

/* ---------- 모드 전환 ---------- */
document.getElementById("btnModeApply").addEventListener("click", () => { mode = "apply"; renderAll(); });
document.getElementById("btnModeAdmin").addEventListener("click", () => { mode = "admin"; renderAll(); });

/* ============================================================
   렌더링
   ============================================================ */
function renderAll() {
  document.getElementById("btnModeApply").classList.toggle("active", mode === "apply");
  document.getElementById("btnModeAdmin").classList.toggle("active", mode === "admin");
  document.getElementById("applyView").classList.toggle("hidden", mode !== "apply");
  document.getElementById("adminView").classList.toggle("hidden", mode !== "admin");

  const pendingCount = reservations.filter((r) => r.status === "pending").length;
  const badge = document.getElementById("pendingBadge");
  badge.textContent = pendingCount;
  badge.classList.toggle("hidden", pendingCount === 0);

  if (mode === "apply") renderApplyView(); else renderAdminView();
}

function activeDayReservations(date) {
  return reservations.filter((r) => r.date === date && r.status !== "rejected");
}
function dayReservations(date) {
  return reservations.filter((r) => r.date === date)
    .sort((a, b) => toMin(a.startTime) - toMin(b.startTime));
}

function slotStatusFor(date, slotStart) {
  const [h, m] = slotStart.split(":").map(Number);
  const endM = m + 30;
  const endStr = endM >= 60
    ? `${String(h + 1).padStart(2, "0")}:${String(endM - 60).padStart(2, "0")}`
    : `${String(h).padStart(2, "0")}:${String(endM).padStart(2, "0")}`;
  const hit = activeDayReservations(date).find((r) => overlaps(slotStart, endStr, r.startTime, r.endTime));
  return hit ? hit.status : null;
}

function renderLedger(date, compact) {
  const now = new Date();
  const isToday = date === todayStr();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const rows = GRID_SLOTS.map((slot) => {
    const status = slotStatusFor(date, slot);
    const meta = status ? STATUS_META[status] : null;
    const isNowLine = isToday && nowMin >= toMin(slot) && nowMin < toMin(slot) + 30;
    return `
      <div class="ledger-row ${compact ? "compact" : ""}" style="background:${meta ? meta.bg : "#FFFFFF"}">
        ${isNowLine ? '<div class="now-line"></div>' : ""}
        <span class="ledger-time">${slot}</span>
        <div class="ledger-bar" style="${meta ? `border:1px solid ${meta.border}` : ""}"></div>
        ${meta ? `<span class="ledger-status" style="color:${meta.text}">${meta.label}</span>` : ""}
      </div>`;
  }).join("");
  return `<div class="ledger">${rows}</div>`;
}

function renderDateNav(navId, date) {
  return `
    <div class="date-nav" id="${navId}">
      <button class="nav-btn" data-act="prev">◀ 전날</button>
      <input class="input" style="width:auto" type="date" value="${date}" data-act="pick" />
      <span class="date-label">${fmtDateLabel(date)}</span>
      <button class="nav-btn" data-act="next">다음날 ▶</button>
      <button class="nav-btn" style="margin-left:auto" data-act="today">오늘</button>
    </div>`;
}

function wireDateNav(navId, getDate, setDate) {
  const el = document.getElementById(navId);
  el.querySelector('[data-act="prev"]').addEventListener("click", () => {
    const d = new Date(getDate() + "T00:00:00"); d.setDate(d.getDate() - 1);
    setDate(d.toISOString().slice(0, 10));
  });
  el.querySelector('[data-act="next"]').addEventListener("click", () => {
    const d = new Date(getDate() + "T00:00:00"); d.setDate(d.getDate() + 1);
    setDate(d.toISOString().slice(0, 10));
  });
  el.querySelector('[data-act="today"]').addEventListener("click", () => setDate(todayStr()));
  el.querySelector('[data-act="pick"]').addEventListener("change", (e) => setDate(e.target.value));
}

function renderResRow(r, actionsHtml) {
  const meta = STATUS_META[r.status];
  return `
    <div class="res-row" data-id="${r.id}">
      <div class="top">
        <div>
          <div class="time-badge">
            <span class="time-mono">${r.date} · ${r.startTime}~${r.endTime}</span>
            <span class="status-pill" style="background:${meta.bg};color:${meta.text};border-color:${meta.border}">${meta.label}</span>
          </div>
          <p class="meta">${escapeHtml(r.eventName)} · 담당 ${escapeHtml(r.manager)} · ${r.attendees}명</p>
          <p class="purpose">${escapeHtml(r.purpose)}</p>
          ${r.status === "rejected" && r.rejectReason ? `<p class="reject-reason">거절 사유: ${escapeHtml(r.rejectReason)}</p>` : ""}
        </div>
        ${actionsHtml ? `<div class="res-actions">${actionsHtml}</div>` : ""}
      </div>
    </div>`;
}

/* ---------- 신청자 화면 ---------- */
function renderApplyView() {
  const list = activeDayReservations(applyDate).sort((a,b)=>toMin(a.startTime)-toMin(b.startTime));
  const html = `
    <div class="grid-2col">
      <div class="card">
        <h2>예약 신청</h2>
        <p class="sub">신청 후 담당자 승인이 완료되면 예약이 확정됩니다.</p>
        <form id="applyForm">
          <label class="field"><span>사용 날짜</span>
            <input class="input" type="date" id="f-date" value="${applyDate}" min="${todayStr()}" required />
          </label>
          <div class="row">
            <div><label class="field"><span>시작 시간</span>
              <select class="input" id="f-start">${START_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join("")}</select>
            </label></div>
            <div><label class="field"><span>종료 시간</span>
              <select class="input" id="f-end">${END_OPTIONS.map(t=>`<option value="${t}" ${t==="10:00"?"selected":""}>${t}</option>`).join("")}</select>
            </label></div>
          </div>
          <label class="field"><span>행사명</span>
            <input class="input" id="f-eventName" maxlength="60" placeholder="청년가공창업 교육 3회차" required />
          </label>
          <div class="row">
            <div style="flex:2"><label class="field"><span>담당자명</span>
              <input class="input" id="f-manager" maxlength="20" placeholder="홍길동" required />
            </label></div>
            <div style="flex:1"><label class="field"><span>인원</span>
              <input class="input" type="number" min="1" max="300" id="f-attendees" placeholder="15" required />
            </label></div>
          </div>
          <label class="field"><span>사용 목적</span>
            <textarea class="input" id="f-purpose" maxlength="300" placeholder="예: 시제품 시식 평가 및 참가자 피드백 수렴" required></textarea>
          </label>
          <div id="formMsg"></div>
          <button type="submit" class="submit-btn">예약 신청하기</button>
        </form>
      </div>
      <div>
        ${renderDateNav("applyDateNav", applyDate)}
        <div class="card" style="padding:16px">
          <div class="legend">
            ${["pending","approved","rejected"].map(s=>`
              <span class="legend-item"><span class="legend-swatch" style="background:${STATUS_META[s].bg};border:1px solid ${STATUS_META[s].border}"></span>${STATUS_META[s].label}</span>
            `).join("")}
          </div>
          ${renderLedger(applyDate, false)}
        </div>
        ${list.length > 0 ? `
          <div style="margin-top:16px">
            <p style="font-size:13px;font-weight:500;color:#4C5349;margin-bottom:8px">이 날짜의 예약 (${list.length}건)</p>
            ${list.map(r => renderResRow(r, "")).join("")}
          </div>` : ""}
      </div>
    </div>`;
  document.getElementById("applyView").innerHTML = html;

  wireDateNav("applyDateNav", () => applyDate, (d) => {
    if (d < todayStr()) { alert("지난 날짜는 선택할 수 없습니다."); return; }
    applyDate = d; renderApplyView();
  });
  document.getElementById("f-date").addEventListener("change", (e) => {
    if (e.target.value < todayStr()) { alert("지난 날짜는 선택할 수 없습니다."); e.target.value = applyDate; return; }
    applyDate = e.target.value; renderApplyView();
  });
  document.getElementById("applyForm").addEventListener("submit", submitReservation);
}

let isSubmitting = false;

async function submitReservation(e) {
  e.preventDefault();
  if (isSubmitting) return;

  const msgEl = document.getElementById("formMsg");
  msgEl.innerHTML = "";

  const date = document.getElementById("f-date").value;
  const startTime = document.getElementById("f-start").value;
  const endTime = document.getElementById("f-end").value;
  const eventName = document.getElementById("f-eventName").value.trim();
  const manager = document.getElementById("f-manager").value.trim();
  const attendeesRaw = document.getElementById("f-attendees").value;
  const purpose = document.getElementById("f-purpose").value.trim();

  if (!date || !eventName || !manager || !attendeesRaw || !purpose) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">모든 항목을 입력해 주세요.</p>`;
    return;
  }
  if (date < todayStr()) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">지난 날짜는 신청할 수 없습니다.</p>`;
    return;
  }
  if (eventName.length > 60 || manager.length > 20) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">행사명은 60자, 담당자명은 20자를 넘을 수 없습니다.</p>`;
    return;
  }
  if (manager.length < 2) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">담당자명을 정확히 입력해 주세요.</p>`;
    return;
  }
  if (purpose.length > 300) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">사용 목적은 300자를 넘을 수 없습니다.</p>`;
    return;
  }
  if (toMin(startTime) >= toMin(endTime)) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">종료 시간은 시작 시간보다 늦어야 합니다.</p>`;
    return;
  }
  if (date === todayStr()) {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if (toMin(startTime) < nowMin) {
      msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">이미 지난 시간대는 신청할 수 없습니다.</p>`;
      return;
    }
  }
  const attendees = Number(attendeesRaw);
  if (!Number.isInteger(attendees) || attendees <= 0) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">인원은 1 이상의 숫자로 입력해 주세요.</p>`;
    return;
  }
  if (attendees > 300) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">인원은 300명을 넘을 수 없습니다. 실제 규모에 맞게 입력해 주세요.</p>`;
    return;
  }

  // 중복/겹침 신청 방지: 승인 대기 중이거나 이미 승인된 예약과 시간이 겹치면 차단
  const conflict = reservations.find(r =>
    r.date === date && r.status !== "rejected" && overlaps(startTime, endTime, r.startTime, r.endTime));
  if (conflict) {
    const statusLabel = STATUS_META[conflict.status].label;
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">이미 ${statusLabel === "승인됨" ? "승인된" : "신청 접수된(승인 대기 중인)"} 예약(${conflict.startTime}~${conflict.endTime}, ${escapeHtml(conflict.eventName)})과 시간이 겹칩니다. 다른 시간대를 선택해 주세요.</p>`;
    return;
  }

  const submitBtn = document.querySelector("#applyForm .submit-btn");
  isSubmitting = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "신청 처리 중…";

  try {
    await addDoc(collection(db, "reservations"), {
      date, startTime, endTime, eventName, manager, attendees, purpose,
      status: "pending", rejectReason: "", createdAt: serverTimestamp(),
    });
    document.getElementById("applyForm").reset();
    msgEl.innerHTML = `<p class="banner-notice">예약 신청이 접수되었습니다. 담당자 승인 후 확정됩니다.</p>`;
  } catch (err) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">신청 중 오류가 발생했습니다: ${escapeHtml(err.message)}</p>`;
  } finally {
    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "예약 신청하기";
  }
}

/* ---------- 담당자 화면 ---------- */
function renderAdminView() {
  if (!currentUser) {
    document.getElementById("adminView").innerHTML = `
      <div class="card signin-box">
        <h2 style="margin-bottom:0">담당자 로그인</h2>
        <p>구글 계정으로 로그인하면 승인 권한을 확인합니다.</p>
        <button class="google-btn" id="googleSignInBtn">Google 계정으로 로그인</button>
      </div>`;
    document.getElementById("googleSignInBtn").addEventListener("click", () => {
      signInWithPopup(auth, provider).catch((e) => showGlobalBanner(`로그인 실패: ${e.message}`));
    });
    return;
  }

  if (!isAdmin) {
    document.getElementById("adminView").innerHTML = `
      <div class="card signin-box">
        <h2 style="margin-bottom:0">권한 없음</h2>
        <p>${escapeHtml(currentUser.email)} 계정은 담당자 목록에 등록되어 있지 않습니다.<br/>관리자에게 Firestore admins 목록 등록을 요청해 주세요.</p>
        <button class="nav-btn" id="signOutBtn">다른 계정으로 로그인</button>
      </div>`;
    document.getElementById("signOutBtn").addEventListener("click", () => signOut(auth));
    return;
  }

  const pendingToday = dayReservations(adminDate).filter(r => r.status === "pending");
  let list = [...reservations].sort((a,b)=> a.date !== b.date ? a.date.localeCompare(b.date) : toMin(a.startTime)-toMin(b.startTime));
  if (adminFilter !== "all") list = list.filter(r => r.status === adminFilter);

  const filters = [["all","전체"],["pending","승인 대기"],["approved","승인됨"],["rejected","거절됨"]];

  document.getElementById("adminView").innerHTML = `
    <div class="signed-in-bar">
      <span>담당자: ${escapeHtml(currentUser.email)}</span>
      <button id="signOutBtn2">로그아웃</button>
    </div>
    <div class="grid-2col-rev">
      <div>
        <div class="filter-bar">
          ${filters.map(([k,l]) => `<button class="filter-btn ${adminFilter===k?"active":""}" data-filter="${k}">${l}</button>`).join("")}
        </div>
        <div id="adminList">
          ${list.length === 0
            ? `<div class="card"><p class="muted">해당 조건의 예약이 없습니다.</p></div>`
            : list.map(r => renderResRow(r,
                r.status === "pending"
                  ? `<button class="btn-approve" data-act="approve" data-id="${r.id}">승인</button><button class="btn-reject" data-act="reject" data-id="${r.id}">거절</button>`
                  : r.status === "approved"
                    ? `<button class="btn-reject" data-act="reject" data-id="${r.id}">취소·거절</button>`
                    : `<button class="nav-btn" data-act="reopen" data-id="${r.id}">대기로 되돌리기</button>`
              )).join("")
          }
        </div>
      </div>
      <div>
        ${renderDateNav("adminDateNav", adminDate)}
        ${pendingToday.length > 0 ? `<div class="banner banner-pending">이 날짜에 승인 대기 ${pendingToday.length}건이 있습니다.</div>` : ""}
        <div class="card" style="padding:16px">${renderLedger(adminDate, true)}</div>
      </div>
    </div>`;

  document.getElementById("signOutBtn2").addEventListener("click", () => signOut(auth));
  wireDateNav("adminDateNav", () => adminDate, (d) => { adminDate = d; renderAdminView(); });

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => { adminFilter = btn.dataset.filter; renderAdminView(); });
  });

  document.getElementById("adminList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    const target = reservations.find(r => r.id === id);
    if (!target) return;

    if (act === "approve") {
      const conflict = reservations.find(r => r.id !== id && r.date === target.date && r.status === "approved" &&
        overlaps(target.startTime, target.endTime, r.startTime, r.endTime));
      if (conflict) {
        alert(`이미 승인된 다른 예약(${conflict.startTime}~${conflict.endTime}, ${conflict.eventName})과 겹쳐 승인할 수 없습니다.`);
        return;
      }
      try {
        await updateDoc(doc(db, "reservations", id), { status: "approved", rejectReason: "" });
      } catch (err) { alert(`승인 처리 중 오류: ${err.message}`); }
    } else if (act === "reject") {
      const reason = window.prompt("거절 사유를 입력해 주세요.", "");
      if (reason === null) return;
      if (!reason.trim()) { alert("거절 사유를 입력해야 합니다."); return; }
      try {
        await updateDoc(doc(db, "reservations", id), { status: "rejected", rejectReason: reason.trim() });
      } catch (err) { alert(`거절 처리 중 오류: ${err.message}`); }
    } else if (act === "reopen") {
      try {
        await updateDoc(doc(db, "reservations", id), { status: "pending", rejectReason: "" });
      } catch (err) { alert(`처리 중 오류: ${err.message}`); }
    }
  });
}

renderAll();
</script>
